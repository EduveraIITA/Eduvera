name: Institution directory checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/institution-directory-search]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduera_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: eduera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eduera_test:test_only@127.0.0.1:5432/eduera_test
      COOKIE_SECRET: directory-ci-cookie-secret-not-a-production-secret
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend checks with isolated PostgreSQL
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run db:migrate
          python3 scripts/generate_school_data.py
          node --import tsx src/database/seed.ts
          npm run test:seed
          npm test
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Desktop typecheck and build
        working-directory: frontend-desktop
        run: |
          npm ci
          npm run typecheck
          npm run build
