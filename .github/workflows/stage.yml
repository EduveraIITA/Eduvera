name: Stage

on:
  push:
    branches: [Stage]
  workflow_dispatch:

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  # Verification never connects to the staging database. Each job gets a new
  # PostgreSQL service, migrations and deterministic demo fixtures.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eduera_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: eduera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduera_test -d eduera_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://eduera_test:isolated-test-only@127.0.0.1:5432/eduera_test
      COOKIE_SECRET: isolated-ci-cookie-secret-at-least-32-characters
      TEST_DATABASE_ISOLATED: "true"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend · install, typecheck, lint, build
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Backend · apply pending migrations
        working-directory: backend
        run: npm run db:migrate

      - name: Backend · seed isolated test database
        working-directory: backend
        run: |
          python3 scripts/generate_school_data.py
          node --import tsx src/database/seed.ts

      - name: Backend · integration tests
        working-directory: backend
        run: npx vitest run

      - name: Mobile app · install, typecheck, build, test
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Desktop dashboard · install, typecheck, build
        working-directory: frontend-desktop
        run: |
          npm ci
          npm run typecheck
          npm run build

  # Ships one container to Railway (Singapore) that serves all three:
  # the mobile app at /, the desktop dashboard at /staff/, the API at /api.
  # Railway builds backend/Dockerfile with the repo root as context (railway.json).
  deploy:
    name: Deploy to Railway
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'omnischool' }}
      STAGE_URL: ${{ vars.STAGE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment credentials
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Run deploy/railway-bootstrap.py once with a Railway account token to create the project and store this secret."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci

      - name: Health check the public URL
        if: env.STAGE_URL != ''
        run: |
          echo "Waiting for $STAGE_URL/readyz"
          for i in $(seq 1 48); do
            body=$(curl -fsS "$STAGE_URL/readyz" 2>/dev/null || true)
            if echo "$body" | grep -q '"ready"'; then
              echo "API ready: $body"
              echo "Mobile app  $STAGE_URL/        [$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/")]"
              echo "Desktop     $STAGE_URL/staff/  [$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/staff/")]"
              echo "API docs    $STAGE_URL/api/docs [$(curl -s -o /dev/null -w '%{http_code}' "$STAGE_URL/api/docs")]"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$STAGE_URL did not become ready in time"
          exit 1
