name: Stage

on:
  push:
    branches: [Stage]
  pull_request:
    branches: [Stage]
  workflow_dispatch:

concurrency:
  # PR verification must not cancel an in-flight Stage deployment.
  group: stage-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Tests use disposable PostgreSQL, never the live Stage database.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: omnischool_test
          POSTGRES_USER: omnischool_test
          POSTGRES_PASSWORD: omnischool-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=omnischool_test --dbname=omnischool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      MIGRATION_DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      EVENT_DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      COOKIE_SECRET: integration-test-cookie-secret-at-least-32
      TEST_DATABASE_ISOLATED: "true"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.27.2
        with:
          args: git --redact --verbose .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Google Cloud deployment contract tests
        run: node --test deploy/gcp/*.test.mjs
      - name: Backend · install, typecheck, lint, build
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
      - name: Backend · prepare isolated test database
        working-directory: backend
        run: |
          npm run db:migrate
          python3 scripts/generate_school_data.py
          node --import tsx src/database/seed.ts
          node --import tsx src/database/seed-operations.ts
          node --import tsx src/database/seed-roles.ts
          node --import tsx src/database/seed-departure.ts
          node --import tsx src/database/seed-governance-authority.ts
          node --import tsx src/database/seed-access-roles.ts
      - name: Backend · integration tests
        working-directory: backend
        run: npm test
      - name: Mobile app · install, typecheck, lint, build, test
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npm test
      - name: Desktop dashboard · install, typecheck, build
        working-directory: frontend-desktop
        run: |
          npm ci
          npm run typecheck
          npm run build

  google-cloud:
    name: Google Cloud Stage
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Stage'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/google-cloud-stage.yml
