name: Stage

on:
  push:
    branches: [Stage]
  pull_request:
    branches: [Stage]
  workflow_dispatch:

concurrency:
  # PR verification must not cancel an in-flight Stage deployment.
  group: ${{ contains(github.event.head_commit.message, '[provision-gatekeeper]') && 'stage-gatekeeper' || 'stage' }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contracts:
    name: Security and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.27.2
        env:
          # The scanner runs in a container with a different repository owner.
          # Without this it may report success after scanning zero commits.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Google Cloud deployment contract tests
        run: node --test deploy/gcp/*.test.mjs
      - name: Matrix private configuration contracts
        run: |
          python3 -m unittest discover -s deploy/matrix -p 'test_*.py' -v
          python3 deploy/matrix/generate-config.py --server-name chat.example.test
          docker compose -f deploy/matrix/compose.yaml config --quiet

  # Tests use disposable PostgreSQL, never the live Stage database.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: omnischool_test
          POSTGRES_USER: omnischool_test
          POSTGRES_PASSWORD: omnischool-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=omnischool_test --dbname=omnischool_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      MIGRATION_DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      EVENT_DATABASE_URL: postgresql://omnischool_test:omnischool-test-only-password@127.0.0.1:5432/omnischool_test
      COOKIE_SECRET: integration-test-cookie-secret-at-least-32
      TEST_DATABASE_ISOLATED: "true"
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend · install, typecheck, lint, build
        working-directory: backend
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: Backend · prepare isolated test database
        working-directory: backend
        run: |
          npm run db:migrate
          python3 scripts/generate_school_data.py
          node --import tsx src/database/seed.ts
          node --import tsx src/database/seed-operations.ts
          npm run db:seed:roles
          npm run db:seed:departure
          npm run db:seed:governance-authority
          npm run db:seed:access-roles
      - name: Backend · integration tests
        working-directory: backend
        run: npm run test:ci

  clients:
    name: Build · ${{ matrix.directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint responsive app
        run: npm run lint
      # The build script includes tsc -b, so a separate typecheck repeats that work.
      - run: npm run build

  mobile-tests:
    name: Mobile tests · ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # Keep the existing required check name; fail closed on failed/cancelled jobs.
  verify:
    name: Verify
    needs: [contracts, backend, clients, mobile-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = Object.values(JSON.parse(process.env.RESULTS)); if (!jobs.every(job => job.result === "success")) process.exit(1)'

  google-cloud:
    name: Google Cloud Stage
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/Stage' && !contains(github.event.head_commit.message, '[provision-gatekeeper]')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/google-cloud-stage.yml
    with:
      website_only: ${{ contains(github.event.head_commit.message, '[website-only]') }}

  gatekeeper-provision:
    name: Authorized Stage gatekeeper account
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/Stage' && contains(github.event.head_commit.message, '[provision-gatekeeper]')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/google-cloud-stage.yml
    with:
      provision_gatekeeper: true
