name: Student Pulse checks
on:
  push:
    branches: [feature/student-pulse-screens]
  pull_request:
    branches: [Stage]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/student-pulse.yml'
permissions:
  contents: read
concurrency:
  group: student-pulse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_pulse_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/student_pulse_ci
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/student_pulse_ci
      TEST_DATABASE_ISOLATED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm run db:migrate
        working-directory: backend
      - name: Student Pulse database and rule tests
        run: npx vitest run test/student-pulse-rules.test.ts test/student-pulse.integration.test.ts
        working-directory: backend
      - run: npx eslint src/student-pulse test/student-pulse*.test.ts --max-warnings=0
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
