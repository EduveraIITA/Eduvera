name: Container build validation

on:
  pull_request:
    branches: [Stage]
    paths:
      - '.github/workflows/container-builds.yml'
      - '.github/workflows/google-cloud-stage.yml'
      - '.dockerignore'
      - 'backend/Dockerfile'
      - 'marketing/Dockerfile'
      - 'services/photo-attendance/Dockerfile'

permissions:
  contents: read

concurrency:
  group: container-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            dockerfile: backend/Dockerfile
            cache: stage-web
          - context: services/photo-attendance
            dockerfile: services/photo-attendance/Dockerfile
            cache: stage-photo
          - context: marketing
            dockerfile: marketing/Dockerfile
            cache: stage-marketing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Validate production Docker build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.cache }}
