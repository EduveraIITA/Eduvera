name: Google Cloud Stage release

on:
  workflow_call:
    inputs:
      website_only:
        type: boolean
        default: false
        required: false
      provision_gatekeeper:
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-cloud-stage-release
  cancel-in-progress: false

jobs:
  build-images:
    if: github.ref == 'refs/heads/Stage' && github.repository == 'EduveraIITA/Eduvera' && !inputs.provision_gatekeeper && !inputs.website_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gcp-stage
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: backend/Dockerfile
            cache: stage-web
          - image: photo-attendance
            context: services/photo-attendance
            dockerfile: services/photo-attendance/Dockerfile
            cache: stage-photo
          - image: thatcampus
            context: marketing
            dockerfile: marketing/Dockerfile
            cache: stage-marketing
    env:
      GCP_PROJECT_ID: eduera-511111
      GCP_REGION: asia-south1
      GCP_SERVICE: eduvera-stage
      GCP_PHOTO_SERVICE: eduvera-stage-photo
      GCP_MIGRATION_JOB: eduvera-stage-migrate
      GCP_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/web
      GCP_PHOTO_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/photo-attendance
      GCP_STAGE_DEPLOY_ENABLED: ${{ vars.GCP_STAGE_DEPLOY_ENABLED }}
      GCP_TRIAL_DEPLOY_UNTIL: ${{ vars.GCP_TRIAL_DEPLOY_UNTIL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check target and trial deployment window
        run: node deploy/gcp/release.mjs guard
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: matrix.image != 'thatcampus' || vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
      - name: Build release image with layer cache
        if: matrix.image != 'thatcampus' || vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: asia-south1-docker.pkg.dev/eduera-511111/eduera/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max,ignore-error=true
      # Authenticate after the build so a long build cannot expire the OIDC token.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: matrix.image != 'thatcampus' || vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        with:
          project_id: eduera-511111
          workload_identity_provider: projects/367469594690/locations/global/workloadIdentityPools/github-stage/providers/eduvera-stage
          service_account: github-stage-deploy@eduera-511111.iam.gserviceaccount.com
      - if: matrix.image != 'thatcampus' || vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push release image
        if: matrix.image != 'thatcampus' || vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        env:
          IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/${{ matrix.image }}
        run: |
          gcloud artifacts repositories describe eduera --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(name)'
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    needs: build-images
    if: github.ref == 'refs/heads/Stage' && github.repository == 'EduveraIITA/Eduvera' && !inputs.provision_gatekeeper && !inputs.website_only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: gcp-stage
    env:
      GCP_PROJECT_ID: eduera-511111
      GCP_REGION: asia-south1
      GCP_SERVICE: eduvera-stage
      GCP_PHOTO_SERVICE: eduvera-stage-photo
      GCP_MIGRATION_JOB: eduvera-stage-migrate
      GCP_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/web
      GCP_PHOTO_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/photo-attendance
      GCP_STAGE_DEPLOY_ENABLED: ${{ vars.GCP_STAGE_DEPLOY_ENABLED }}
      GCP_TRIAL_DEPLOY_UNTIL: ${{ vars.GCP_TRIAL_DEPLOY_UNTIL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check target and trial deployment window
        run: node deploy/gcp/release.mjs guard
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: eduera-511111
          workload_identity_provider: projects/367469594690/locations/global/workloadIdentityPools/github-stage/providers/eduvera-stage
          service_account: github-stage-deploy@eduera-511111.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Migrate, verify candidate, promote and verify public service
        if: vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        run: node deploy/gcp/release.mjs deploy
      - name: Report prepared image (not a deployment)
        if: vars.GCP_STAGE_DEPLOY_ENABLED != 'true'
        run: |
          echo '### Google Cloud image prepared; deployment is disabled' >> "$GITHUB_STEP_SUMMARY"
          echo 'Keyless access and image upload succeeded. Database/file migration and runtime verification must finish before GCP_STAGE_DEPLOY_ENABLED is enabled. The existing app is unchanged.' >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the separate ThatCampus website
        if: vars.GCP_STAGE_DEPLOY_ENABLED == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node marketing/deploy.mjs

  provision-gatekeeper:
    if: inputs.provision_gatekeeper && github.ref == 'refs/heads/Stage' && github.repository == 'EduveraIITA/Eduvera'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: gcp-stage
    env:
      GCP_PROJECT_ID: eduera-511111
      GCP_REGION: asia-south1
      GCP_SERVICE: eduvera-stage
      GCP_PHOTO_SERVICE: eduvera-stage-photo
      GCP_MIGRATION_JOB: eduvera-stage-migrate
      GCP_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/web
      GCP_PHOTO_IMAGE: asia-south1-docker.pkg.dev/eduera-511111/eduera/photo-attendance
      GCP_STAGE_DEPLOY_ENABLED: ${{ vars.GCP_STAGE_DEPLOY_ENABLED }}
      GCP_TRIAL_DEPLOY_UNTIL: ${{ vars.GCP_TRIAL_DEPLOY_UNTIL }}
      PROVISION_GATEKEEPER: 'true'
      GATEKEEPER_OPERATION_ID: 270762d5-1025-4f4a-aac5-86113900a2b8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify bounded account operation
        run: node --test deploy/gcp/provision-stage-gatekeeper.test.mjs deploy/gcp/provision-demo-gatekeeper.test.mjs
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: eduera-511111
          workload_identity_provider: projects/367469594690/locations/global/workloadIdentityPools/github-stage/providers/eduvera-stage
          service_account: github-stage-deploy@eduera-511111.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Create the authorized review gatekeeper through the private database job
        if: ${{ !contains(github.event.head_commit.message, '[new-gate-demo]') }}
        run: node deploy/gcp/provision-stage-gatekeeper.mjs
      - name: Create the separately authorized gate.demo account and Gatekeeper role binding
        if: contains(github.event.head_commit.message, '[new-gate-demo]')
        env:
          CREATE_NEW_GATE_DEMO: 'true'
        run: node deploy/gcp/provision-demo-gatekeeper.mjs

  website-only:
    if: inputs.website_only && github.ref == 'refs/heads/Stage' && github.repository == 'EduveraIITA/Eduvera' && !inputs.provision_gatekeeper
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gcp-stage
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require a bounded website-only release
        run: |
          git diff --name-only HEAD^ HEAD > /tmp/release-paths
          if grep -Ev '^(marketing/|docs/marketing/|docs/blueprint/IMPLEMENTATION_PLAN.md$|.github/workflows/(stage|google-cloud-stage|thatcampus).yml$)' /tmp/release-paths; then exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - name: Verify and build website without touching the application
        working-directory: marketing
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          node test/visual.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build website image with layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: marketing
          file: marketing/Dockerfile
          platforms: linux/amd64
          load: true
          tags: asia-south1-docker.pkg.dev/eduera-511111/eduera/thatcampus:${{ github.sha }}
          cache-from: type=gha,scope=stage-marketing
          cache-to: type=gha,scope=stage-marketing,mode=max,ignore-error=true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: eduera-511111
          workload_identity_provider: projects/367469594690/locations/global/workloadIdentityPools/github-stage/providers/eduvera-stage
          service_account: github-stage-deploy@eduera-511111.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Push and verify candidate before website-only promotion
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
          docker push "asia-south1-docker.pkg.dev/eduera-511111/eduera/thatcampus:$GITHUB_SHA"
          node marketing/deploy-website-only.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stitch-preview-verification
          path: marketing/screenshots/
